name: Safety scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Safety scan (secrets, personal identifiers, local patterns)
        run: node scripts/scan-safety.js
